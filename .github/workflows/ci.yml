name: CI

on:
  push:
    branches: [main]
    # Fire on v-prefixed release tags so the tag-gated release jobs (gated on
    # `refs/tags/v*`) run — mobile-release, cohab, build-ios, xcframework, etc.
    tags: ['v*']
  pull_request:

concurrency:
  # CIRISEdge#293 — dedup redundant runs, but NEVER cancel a release tag's run.
  # A merge (refs/heads/main) and its release tag (refs/tags/v*) are the SAME
  # commit. The old SHA-shared group + cancel-in-progress was a RACE — whichever
  # push REGISTERED LAST won — and on v16.0.2 the main-push run cancelled the TAG
  # run, losing the full release matrix + mobile-release (no Release, no signed
  # manifests). Fix: give TAGS their own ref-based group so a same-SHA main-push
  # can never cancel the release run. PRs key on the ref (a new push cancels the
  # stale PR run); branch pushes key on the SHA (main-push self-dedup preserved).
  # Trade: a released commit's non-tag matrix runs on both the main AND tag runs —
  # a bounded, infrequent cost, in exchange for a release that always publishes.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || (startsWith(github.ref, 'refs/tags/v') && github.ref || github.sha) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # ── Crates.io index resilience ──
  # Default `CARGO_NET_RETRY` is 3, which has surfaced as a flake
  # surface on macOS PyO3 cross-compile lanes (the iOS PyO3 sim job on
  # PR #76 hit "no matching package named `heck` found" — the
  # non-sim iOS PyO3 lane pulled the identical dep and succeeded
  # within the same run). Bumping to 10 catches the long-tail of
  # transient `index.crates.io` resolution flakes without changing
  # behavior on the happy path. Per cargo-cooldown's
  # COOLDOWN_HTTP_RETRIES precedent (default 2, max 8 — we go one
  # above for stateless CI). Cross-process retry (via
  # nick-fields/retry@v3) wraps the historically-flake-prone
  # cargo invocations in the iOS / Android cross-compile lanes —
  # see the matching steps below for the per-step retry policy.
  CARGO_NET_RETRY: "10"

jobs:
  # ─── linux-x86_64 — feature-combo gauntlet ──────────────────────────
  # 45.x LTS — edge no longer SHIPS Python (the last release with wheels
  # was v45.1.9). The integration suite moved off the pyo3 feature onto the
  # `full` entry; the pyo3 binding (still in-tree until the v62 line, and
  # still compiled into CIRISServer's one wheel) keeps its own `pyo3-lib`
  # entry so its unit tests keep running. The other entries are the
  # lane-isolation gauntlet.
  #
  # ## Feature-combo matrix (per persist's `linux-x86_64-test`
  # substrate-matrix precedent — CIRISPersist v2.0.1)
  #
  # Edge's optional features compose orthogonally — a regression in
  # one transport lane can hide behind another lane being enabled.
  # Before this matrix, a single full-features invocation masked
  # `cfg(feature = "transport-reticulum")` breakage that the
  # `transport-http`-only build would surface immediately. The
  # matrix catches lane-isolation regressions at PR time, not at
  # downstream consumer integration.
  #
  # Entries:
  #   - core: minimal — just `transport-http`. Catches any module
  #     that accidentally requires reticulum / packet-radio / pyo3
  #     to compile.
  #   - reticulum: canonical wire (MISSION §1.4). Builds the
  #     Leviculum-backed stack standalone.
  #   - packet-radio: CIRISEdge#53 N2 transport. Newer + less
  #     battle-tested; first-class gauntlet entry.
  #   - all-transports: all three lanes together. Catches feature-
  #     interaction breakage.
  #   - full: transport-http + transport-reticulum + lxmf + ffi-uniffi.
  #     Runs `cargo test --tests` so lib tests + every integration
  #     suite exercise. This is the set the old `pyo3-full` entry ran
  #     (pyo3 implied transport-reticulum + ffi-uniffi; no integration
  #     suite needs pyo3 itself), minus the binding.
  #   - pyo3-lib: the binding's own unit tests (src/ffi/pyo3.rs and the
  #     pyo3-gated Postgres backend arms) plus the #458 gate. `--lib`
  #     only — the integration suites already ran on `full`.
  #
  # `fail-fast: false` so a regression in one entry doesn't mask
  # regressions in others. Wall-clock = slowest single entry (not
  # the sum) because matrix entries run in parallel — adopted from
  # persist's substrate matrix precedent. Web-search-validated
  # against `cargo-feature-combinations` (the Rust-community
  # canonical pattern) + `doc.rust-lang.org/cargo/guide/continuous-
  # integration.html`. Source citations live in the PR description.
  linux-x86_64-test:
    name: linux-x86_64 (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    # Test binaries link with line tables only, not full debuginfo. Each
    # integration-test binary links persist + verify; at full debuginfo
    # the full --tests set ran the runner out of disk mid-link
    # (`ld … Bus error`, 13 MB free, PR #775) after free-disk-space.
    # Line tables keep file:line in panics and backtraces.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    # v7.4.4 (CIRISEdge#238) — restore only; the canonical linux-x86_64
    # save lives on `desktop-release-build linux-x86_64` (release profile).
    # `packages: write` no longer needed here.
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { name: core,           features: "transport-http" }
          - { name: reticulum,      features: "transport-reticulum" }
          - { name: packet-radio,   features: "transport-packet-radio" }
          - { name: all-transports, features: "transport-http transport-reticulum transport-packet-radio" }
          - { name: full,           features: "transport-http transport-reticulum lxmf ffi-uniffi", all_targets: "true" }
          - { name: pyo3-lib,       features: "transport-http transport-reticulum pyo3 lxmf" }
    steps:
      - uses: actions/checkout@v4
      # full builds the largest target set (--tests: lib +
      # integration tests + benches + doctests against persist + verify
      # + criterion). At persist v5.0.0 + verify v5.0.0 the cumulative
      # compile artifact set exceeds the default GitHub runner's 14GB
      # disk. jlumbroso/free-disk-space frees ~30GB by removing the
      # preinstalled Android SDK / .NET / GHC / dotnet toolchains we
      # don't use — keeps the leaner --lib lanes (core / reticulum /
      # packet-radio / all-transports) from paying the ~60s setup cost.
      - name: free disk space (full + pyo3-lib — large compile footprint)
        if: matrix.combo.name == 'full' || matrix.combo.name == 'pyo3-lib'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      # v7.3.0 (verify v8.0.0 / persist v11.0.0): tss-esapi was removed
      # from ciris-keyring entirely (runtime dlopen plugin is the sole
      # TPM backend now); no libtss2 link-time dep on any target. We
      # still install libsqlite3-dev because persist v3.5.3+ dropped
      # rusqlite's `bundled` feature in favour of dynamic linkage so
      # the wheel + edge share ONE libsqlite3.so at runtime (closes the
      # cross-wheel SIGSEGV CIRISEdge#50 hit at v0.19.5).
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
      # CIRISEdge#229 — canonical layered cache restore (verify →
      # persist → edge) via the local composite at
      # `.github/actions/ciriscache`. Emits the densest edge key as
      # `outputs.key` which the save step below references.
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-combo cache key so each matrix entry gets its own
          # target dir (different feature sets compile to different
          # artifacts; sharing the cache would cause recompile thrash).
          # This is the L1 (in-repo); CIRISCache L2 above is the
          # cross-repo layer keyed on the substrate triple.
          key: ${{ matrix.combo.name }}
      - name: cargo test --features "${{ matrix.combo.features }}"
        # full runs --tests to exercise the integration test suite
        # (transport_http_hardening, reticulum_loopback,
        # https_per_messagetype_roundtrip, peer_mutation_ffi, etc.) plus
        # all lib tests; the transport-lane entries (and pyo3-lib) run
        # --lib only because the integration suites need the full http +
        # reticulum + uniffi stack to link.
        #
        # `--tests` deliberately EXCLUDES benches (criterion's measurement
        # runs at N=2048 take 10+ minutes per Join/Leave point). Bench
        # compile-gating is covered by the separate "cargo bench --no-run
        # (all features)" job; actual perf measurements belong on a
        # nightly cron, not the per-PR critical path.
        #
        # v7.4.2 — cross-process retry via nick-fields/retry@v3. The
        # `linux-x86_64 (reticulum)` lane flaked on v7.4.0 + v7.4.1 with
        # `curl failed [16] HTTP2 framing layer (Send failure: Connection
        # reset by peer)` mid-`cargo metadata` — a transient crates.io
        # CDN edge condition. CARGO_NET_RETRY=10 covers in-process
        # retries; this catches sustained pockets where cargo's budget
        # exhausts. 3 attempts with 60s wait between is the same
        # shape used on android-ndk + build-ios + benches.
        #
        # v45.0.0 — 75 minutes per attempt. On PR #980 a warm (then) pyo3-full
        # --tests run took 40 minutes and the cold first attempt was cut
        # off at 45 with no test failed, so the lane spent a whole
        # attempt on its own budget. This bounds the CI step, not any
        # test's deadline.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 75
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: |
            if [ "${{ matrix.combo.all_targets }}" = "true" ]; then
              cargo test --features "${{ matrix.combo.features }}" --tests
            else
              cargo test --features "${{ matrix.combo.features }}" --lib
            fi
      # CIRISEdge#458 gate — a PQC-less Reticulum transport is REFUSED at init
      # ("stop serving"; the SelfSignedRouteProducer can't mint the #393 item-2
      # binding without the hybrid half). This test is #[ignore]d in the shared
      # run above because persist hosts exactly ONE engine per process and a
      # sibling init test's success pins a hybrid engine — so it must run ALONE
      # to construct its own pqc-less engine and reach the gate. Anti-rot: a gate
      # no lane runs rots silently (CIRISEdge#435).
      - name: "CIRISEdge#458 gate — pqc-less transport refused (own process)"
        if: matrix.combo.name == 'pyo3-lib'
        run: |
          cargo test --features "${{ matrix.combo.features }}" --lib \
            py_init_edge_runtime_refuses_pqc_less_reticulum_transport -- --ignored
      # CIRISEdge#229 — RESTORE only on this lane. The canonical
      # linux-x86_64 save lives on the `desktop-release-build`
      # `linux-x86_64` matrix entry (release-profile `target/`, ~1 GB),
      # matching every other PLAT in the matrix (it was the `pyo3-wheel`
      # entry until the 45.x line stopped building wheels after v45.1.9).
      #
      # v7.4.4 (CIRISEdge#238) — the prior canonical save site was THIS
      # lane (`linux-x86_64-test` / `pyo3-full`). That captured a debug
      # `target/` + every feature combo's artifacts + `incremental/`,
      # ballooning the saved blob to ~7.5 GB. Downstream release
      # consumers (CIRISServer wheels, conformance harness) needed
      # release artifacts; cargo refingerprinted on the wrong profile
      # and recompiled the substrate anyway → 7.5 GB downloaded for ~
      # nothing. Move the save to a release-profile desktop build
      # (~1 GB) — same canonical key, useful blob.

  # ─── network gauntlet — the adversarial-wire + on-wire suite ────────
  # CIRISEdge#932/#414/#426: the transport apply / attribution / fragment path
  # is the arc's most-regressed surface. The 256-case DST proptest runs in every
  # --lib lane, but the HIGH-VOLUME DST soak (`replication::sim::dst_soak`) is
  # `#[ignore]`'d and, before this job, NOTHING in CI ran it — the network-fault
  # gauntlet (fragmentation × MDU-drop × loss × reorder × dup, asserting RESPONDER
  # convergence) was ungated. This job runs it on every push/PR, plus the on-wire
  # integration suite (fragmentation/reassembly, the wire proptest, reticulum
  # loopback + AV-42, multi-tier relay byte-identity, leviculum interface
  # diversity, reachability, route table). transport-reticulum only, so it is
  # a distinct, leaner lane from `full`'s `--tests`.
  network-gauntlet:
    name: network gauntlet (DST fault-soak + on-wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
      # `plat` is required: without it the composite computed
      # `ciris-substrate-v1--release-…`, a key nothing saves, so every
      # restore missed. linux-x86_64 is this runner's canonical PLAT.
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
        with:
          key: network-gauntlet
      - name: DST network-fault soak + on-wire integration gauntlet
        env:
          # High-volume seeded soak (proptest gate is 256 cases in --lib; this is
          # the volume tier). Any non-convergence prints its reproduction seed.
          CIRIS_DST_SOAK: "20000"
          # A/V ALM mesh soak (the #[ignore]'d high-volume tier of the ALM perf
          # suite — 256-case proptest gate runs in --lib; this is the volume tier).
          CIRIS_ALM_SOAK: "20000"
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: |
            set -euo pipefail
            cargo test --features "transport-http transport-reticulum" --lib \
              dst_soak -- --ignored --nocapture
            # A/V ALM mesh soak (topology + heal + capacity under seeded churn/
            # bandwidth-change — the volume tier of the perf suite; a failure
            # prints its reproduction seed).
            cargo test --features "transport-http transport-reticulum" --lib \
              realtime_av_alm::sim::tests::alm_soak -- --ignored --nocapture
            # CIRISEdge#169 — the LXMF propagation admission core + client-pull
            # tests must RUN in CI (compile-lint alone rots — the #435 lesson);
            # the `lxmf` feature is otherwise exercised nowhere on the board.
            cargo test --features "transport-http transport-reticulum lxmf" --lib \
              transport::lxmf_propagation
            cargo test --features "transport-http transport-reticulum" \
              --test fragmentation_reassembly \
              --test replication_wire_proptest \
              --test reticulum_loopback \
              --test reticulum_av42 \
              --test relay_multi_tier_inner_byte_identity \
              --test leviculum_interface_diversity \
              --test reachability_integration \
              --test route_table_e2e \
              --test first_contact_ladder_659 \
              --test explicit_hash_addressing \
              --test realtime_av_spine_e2e

      # CIRISEdge#739 — the multi-GiB transfer witness, CI variant, in its own
      # step so its budget is its own: a 256 MiB self file published on A and
      # pulled by the owner's other device over real Reticulum loopback
      # through the pipelined DAG walk, killed at ~50 % and resumed from the
      # same store — byte-identical, every position adopted exactly once, no
      # chunk reply in the durable outbound queue, and the queue fallback
      # taken when the arrival link is torn down. Correctness only (no
      # ceiling, no K curve): the speed table is the release-build
      # `--ignored` run documented in the test. Budget: 30 minutes (measured
      # locally on a debug build: see the PR for the number).
      # CIRISEdge#749 — the witness fails on a STALL (no new chunk held for
      # its protocol-derived bound), not on wall time. On this runner a debug
      # build lands ≈ 0.7 chunks/s (≈ 12 min per half of the 256 MiB pull), so
      # the budget is publish + setup + two of the test's 20-minute BACKSTOPs.
      - name: bigfile resume witness (CIRISEdge#739)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 50
          max_attempts: 2
          retry_wait_seconds: 60
          shell: bash
          command: |
            set -euo pipefail
            cargo test --features "transport-http transport-reticulum" \
              --test bigfile_739 -- --ignored --nocapture \
              a_256_mib_self_file_resumes_after_a_kill_quick_739

  # ─── test-anchor lane — the #386 ALLOW-path coverage ────────────────
  # CIRISEdge#435: `trace_serve_requires_accord_blessing_and_trusted_root` is
  # the ONLY test that can mint a genuine 2-of-3 accord co-scrub (persist
  # exports the minting support behind the `test-anchor` fence, CIRISPersist#484)
  # — hence the only coverage of the trace-serve ALLOW path AND the only test
  # that can reach the #433 ledger's `serve_capability_not_rooted` arm (leg A
  # must PASS before leg B can refuse). Before this job, NO lane compiled the
  # feature: the test sat broken at HEAD through two fixture waves (the v22
  # ACCORD_HOLDER evidence blob, the #396 item-1 consent bound) with a green
  # board — the exact v13.10.0 dark-gate class it exists to prevent. A gate is
  # only as good as the CI job that runs it (the v15.4.1 gauntlet lesson, one
  # lane over).
  test-anchor-lane:
    name: test-anchor lane (#386 ALLOW path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
      # `plat` is required: without it the composite computed
      # `ciris-substrate-v1--release-…`, a key nothing saves, so every
      # restore missed. linux-x86_64 is this runner's canonical PLAT.
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-anchor-lane
      - name: full lib under test-anchor (ALLOW paths + everything the feature touches)
        # The WHOLE lib, not a module filter: #430's transit-gate ALLOW test
        # lives in transport::realtime_av_alm, and a filter is how the #435
        # class starts — an anchored test outside the filtered module silently
        # never runs. The feature must also not break any always-on test.
        run: cargo test --lib --features test-anchor

  # ─── darwin-aarch64 — Phase 1 macOS dev path ────────────────────────
  # No pyo3 feature here per persist's matrix precedent — the darwin
  # release build (pyo3 included, the shape CIRISServer's macOS wheel
  # compiles) runs via the `desktop-release-build` matrix entry below.
  darwin-aarch64-test:
    name: darwin-aarch64 (no pyo3)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')  # CIRISEdge: off PR (cut runners)
    runs-on: macos-15
    # CIRISEdge#229 — restore only; canonical macos-aarch64 save lives
    # on `desktop-release-build` `darwin-aarch64` (release-profile target/).
    # `packages: write` not needed here.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: macos-aarch64
      - uses: Swatinem/rust-cache@v2
        # cache-bin: false — Swatinem/rust-cache's default cache-bin
        # restores `.cargo/bin/cargo` from older runs on macos-aarch64,
        # which surfaces as `error: unexpected argument 'test' found`
        # right after rustup install completes (the cached shim doesn't
        # match the fresh toolchain). Matches CIRISPersist's v0.7.3 fix.
        # Closes CIRISEdge#9.
        with:
          cache-bin: false
        continue-on-error: true
      - name: Repair toolchain if rustup-init shadow (cache-poison heal)
        # v0.7.0 (CIRISEdge#17) — CIRISVerify v2.1.4+ active-heal pattern.
        # cache-bin: false above is the preventative; this step is the
        # corrective heal for a runner whose `~/.cargo/bin/cargo` IS
        # already the rustup-init shim (the shim passes `cargo --version`
        # but fails on `cargo build`'s argv parser). Verify hit this on
        # macOS runners; persist's v0.7.0/v0.7.1/v0.7.2 cycle exhibited
        # the same failure mode. Defensive — applies to all edge macOS
        # jobs.
        shell: bash
        run: |
          if cargo build --help 2>&1 | grep -q "rustup-init"; then
            echo "::warning::Detected rustup-init shadow in ~/.cargo/bin; reinstalling toolchain"
            rm -rf "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          cargo --version
          cargo build --help >/dev/null
      - name: cargo test --no-run (build the test binaries)
        # The build has its own step and its own budget. Before v45.0.2 it
        # shared the test step's 30 minutes: a cold build took 21 of them, the
        # first attempt always timed out, and a later attempt passed only
        # while the tests alone fit in 30. At v45 they take about 43 minutes
        # on this runner (debug/darwin-open run 43165462094: 64 minutes cold,
        # build included), so v45.0.1's tag run timed out three times and
        # published nothing.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo test --no-run --features "transport-http transport-reticulum"
      - name: cargo test (transport-http + transport-reticulum)
        # transport-reticulum on darwin too — Leviculum's macOS path is
        # load-bearing (CIRISServer ships darwin wheels with edge inside; the teranos fork base
        # exists for macOS compat). CIRISEdge#14.
        #
        # v7.4.2 — same retry wrapper as the linux-x86_64-test matrix
        # for the crates.io CDN flake class. macOS runners hit it
        # at least as often as Linux.
        uses: nick-fields/retry@v3
        with:
          # Tests only (the step above built them): about 43 minutes at v45.
          # Two attempts, because a red test must not be retried into green
          # more than once; the retry is for the runner, not for the suite.
          timeout_minutes: 75
          max_attempts: 2
          retry_wait_seconds: 60
          shell: bash
          command: cargo test --features "transport-http transport-reticulum"
      # CIRISEdge#229 — restore only on this lane. The canonical
      # macos-aarch64 save site is the `desktop-release-build` `darwin-aarch64`
      # matrix entry (release-profile target/, matches what downstream
      # consumers build against). Saving here would write a debug-
      # profile target/ blob over it (same canonical key, second-
      # writer-wins is racey). Restore happens via the composite
      # action above unconditionally — debug builds still pick up the
      # registry layer + warm release artifacts where they match.

  # ─── android-ndk: per-ABI mobile cross-compile (CIRISEdge#17) ───────
  #
  # Pattern lifted from CIRISPersist v2.0.7+ `android-ndk`
  # (CIRISPersist#96–99 closure). Each matrix entry builds
  # `libciris_edge.so` (no PyO3) for native Android consumers (UniFFI /
  # JNI; the Kotlin bindings ride `kotlin-bindings.tar.gz`). Built with
  # `transport-reticulum` only — Reticulum is the canonical cohabitation
  # wire per MISSION §1.4. NO `transport-http` on mobile — HTTP is the
  # documented cloud fallback.
  #
  # 45.x LTS — the Chaquopy PyO3 variant (`libciris_edge_pyo3.so`, the
  # libpython3.10 stub + DT_NEEDED dance, the `android-wheels.tar.gz`
  # asset) is GONE: edge no longer ships Python, and the last release
  # carrying Chaquopy wheels is v45.1.9. Python on Android rides
  # CIRISServer's one wheel. The lessons that lane encoded live in git
  # history (v45.1.9 ci.yml) and CIRISPersist#96–99 if it is ever needed.
  #
  # `pointer_width` = 32 for armeabi-v7a (ARM32), 64 for arm64-v8a and
  # x86_64 — it fed the PyO3 config and is kept in the matrix only as
  # documentation of the ABI.
  android-ndk:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    # CIRISEdge#229 — save edge-self-warm on main (no persist/verify
    # upstream for android-* PLATs; edge owns its own warm cycle).
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # CIRISEdge (cut runners): PR + main build ONE arm64-v8a canary (the
      # #618-class cfg-subset guard: `transport-reticulum` alone, cross-compiled
      # for Android); the full 3-ABI matrix builds only on tags where the
      # android release tarball is cut. Whole-`matrix:` fromJSON — the
      # documented dynamic-matrix form (job-level `if:` can't see `matrix`,
      # CIRISPersist#638).
      #
      # 45.x LTS — the `{plain,pyo3}` variant axis is gone with the Chaquopy
      # wheels; the PR/main canary, which was the arm64 PYO3 cell, is now the
      # arm64 plain cell (what ships). The pyo3-sqlite cfg subset that canary
      # also guarded is kept compiling by the `lint` job's pyo3-sqlite check.
      matrix: ${{ fromJSON( startsWith(github.ref, 'refs/tags/v') && '{"include":[{"abi":"arm64-v8a","target":"aarch64-linux-android","clang_prefix":"aarch64-linux-android24","pointer_width":64},{"abi":"x86_64","target":"x86_64-linux-android","clang_prefix":"x86_64-linux-android24","pointer_width":64},{"abi":"armeabi-v7a","target":"armv7-linux-androideabi","clang_prefix":"armv7a-linux-androideabi24","pointer_width":32}]}' || '{"include":[{"abi":"arm64-v8a","target":"aarch64-linux-android","clang_prefix":"aarch64-linux-android24","pointer_width":64}]}' ) }}
    env:
      # CIRISEdge#216 — sccache over the GHA cache backend (the
      # CIRISServer bench.yml pattern). Compilation-unit caching that
      # survives the version-keyed CIRISCache misses: a persist/leviculum
      # pin bump only recompiles the changed crates, not the dep graph.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Edge's mobile feature set. Reticulum is the canonical cohabitation
      # wire (MISSION §1.4); HTTP is the cloud fallback, intentionally NOT
      # on mobile.
      MOBILE_BASE_FEATURES: "transport-reticulum"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Set up sccache (compiler cache over GHA)
        uses: mozilla-actions/sccache-action@v0.0.9
      # The cache key is the pre-split plain key (`android-<abi>`), so the
      # warm layers the plain cells saved on tags keep hitting. The
      # `android-<abi>-pyo3` keys are no longer saved by anyone and are
      # no longer restored.
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: android-${{ matrix.abi }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}-plain
        continue-on-error: true
      - name: setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
      - name: install cargo-ndk
        run: cargo install cargo-ndk
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Native Android consumers (UniFFI/JNI) take this artifact.
      - name: cargo ndk build (${{ matrix.abi }} — no PyO3)
        # Cross-process retry via nick-fields/retry@v3 — catches
        # transient `index.crates.io` resolution flakes the in-process
        # CARGO_NET_RETRY=10 can't (e.g. when cargo gives up but a
        # fresh process succeeds, which we observed on PR #76's iOS
        # PyO3 sim lane). 3 attempts × 20 min each = worst-case 60 min
        # wall-clock, but typical case is 1 attempt at ~5 min. Same
        # rationale documented at the workflow `env:` block.
        uses: nick-fields/retry@v3
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          timeout_minutes: 20
          max_attempts: 3
        # --platform 24: leviculum-std v0.20.0 pulls `if-addrs`, whose
        # getifaddrs/freeifaddrs exist in bionic only from API 24 (Android
        # 7.0, 2016). cargo-ndk's default (21) left them undefined and the
        # v18.0.0 tag run's plain lanes failed at link — a TAG-ONLY lane, so
        # no PR/main run could catch it. 24 is the Android floor now.
          command: >-
            cargo ndk -t ${{ matrix.abi }} --platform 24 build --release
            --features "$MOBILE_BASE_FEATURES"
      - name: save .so
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp "target/${{ matrix.target }}/release/libciris_edge.so" \
             "dist/${{ matrix.abi }}/libciris_edge.so"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: strip artifacts
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            for so in dist/${{ matrix.abi }}/*.so; do "$STRIP" "$so"; done
          fi
          echo "=== ${{ matrix.abi }} ==="
          ls -la dist/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/
      # CIRISEdge#229 — save edge-self-warm on main, per-ABI.
      - id: cache-save-android
        uses: CIRISAI/CIRISCache/save@v1.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true  # a cache SAVE must never fail a build or a release (v34.3.0: setup-oras HTTP 500 skipped the upload)
        with:
          key: ${{ steps.cachekey.outputs.key }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # CIRISPersist#1022 — a tag run's blob is what downstream exact-pins
          # restore, so a non-publish there is an ::error:: (still under the
          # continue-on-error above: loud, never release-gating).
          strict: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      - name: report unpublished cache save (main)
        if: github.ref == 'refs/heads/main' && steps.cache-save-android.outputs.published != 'true'
        env:
          REASON: ${{ steps.cache-save-android.outputs.reason || 'save step did not reach the push (e.g. setup-oras failed)' }}
        shell: bash
        run: |
          echo "::warning::CIRISCache save not published: ${REASON}"

  # ─── android-package: collect per-ABI artifacts (CIRISEdge#17) ──────
  #
  # Pattern lifted from CIRISPersist v2.0.7+ `android-package`. One output
  # tarball: `ciris-edge-v{VERSION}-android.tar.gz` — raw `.so` per ABI for
  # native Android consumers. (The second tarball,
  # `ciris-edge-v{VERSION}-android-wheels.tar.gz` of Chaquopy abi3 wheels,
  # was last published at v45.1.9.)
  android-package:
    name: package android artifacts
    if: startsWith(github.ref, 'refs/tags/v')  # CIRISEdge: release-only, off PR+merge (cut runners)
    runs-on: ubuntu-latest
    needs: [android-ndk]
    steps:
      - uses: actions/checkout@v4
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-edge-android-*
          path: artifacts/
      - name: package raw android .so tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/android/arm64-v8a dist/android/x86_64 dist/android/armeabi-v7a
          cp artifacts/ciris-edge-android-arm64-v8a/libciris_edge.so    dist/android/arm64-v8a/
          cp artifacts/ciris-edge-android-x86_64/libciris_edge.so       dist/android/x86_64/
          cp artifacts/ciris-edge-android-armeabi-v7a/libciris_edge.so  dist/android/armeabi-v7a/
          tar -czf "dist/ciris-edge-v${VERSION}-android.tar.gz" -C dist android
          echo "✓ ciris-edge-v${VERSION}-android.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-android
          path: dist/ciris-edge-v*-android.tar.gz

  # ─── build-ios: device + simulator (CIRISEdge#17) ───────────────────
  #
  # Pattern lifted verbatim from CIRISVerify v3.1.0 `build-ios` (release.yml).
  # Persist's `ios-build` job uses PyO3 cross-compile + maturin-bypass
  # for a Python-import surface; verify ships a plain Rust cdylib +
  # static archive for swift-bridge / XCFramework consumers. Edge here
  # follows VERIFY'S pattern — plain `transport-reticulum` build, NO
  # PyO3 on iOS. Rationale:
  #
  #   * BeeWare Python-Apple-support is the iOS PyO3 path persist uses,
  #     and it's *load-bearing complexity* for a wheel-shipping crate.
  #     Edge's iOS consumers are native (Swift-via-XCFramework agent
  #     stacks, not a Chaquopy-equivalent Python-on-iOS Briefcase).
  #   * If a Python-on-iOS consumer materializes, copy persist's
  #     `ios-build` job verbatim — that lane is documented + green.
  #     Until then, the simpler verify pattern is the right shape.
  #     (Edge DID carry that lane as `ios-pyo3`, shipping
  #     `ciris-edge-v{VERSION}-ios.tar.gz` of BeeWare `.abi3.so` files,
  #     through v45.1.9. The 45.x LTS stops shipping Python and the lane
  #     is gone; this job inherited its CIRISCache save and its PR/main
  #     simulator canary.)
  #
  # Verify's RUSTFLAGS install_name bake — DO NOT replace with
  # `install_name_tool` post-link. install_name_tool rewrites the
  # Mach-O headers in place, which shifts code section offsets and
  # breaks binary-hash integrity (CIRISVerify v2.0.5 closure). Baking
  # the install_name at link-time via RUSTFLAGS leaves the binary hash
  # stable.
  build-ios:
    name: ios ${{ matrix.target }}
    runs-on: macos-latest
    # CIRISEdge#229 — the canonical CIRISCache save for ios-aarch64 /
    # ios-aarch64-sim (main + tags). It lived on the `ios-pyo3` lane until
    # that lane was removed; without a save here the restore below would
    # read a layer nobody writes.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # CIRISEdge (cut runners): PR + main build ONE simulator canary (the iOS
      # cfg-subset check; it was the `ios-pyo3` sim cell before the 45.x LTS
      # dropped Python); tags build device + simulator for the XCFramework.
      # Whole-`matrix:` fromJSON — the documented dynamic-matrix form
      # (job-level `if:` can't see `matrix`, CIRISPersist#638). `xcframework`
      # stays tag-only, so PR/main never need the device slice.
      matrix: ${{ fromJSON( startsWith(github.ref, 'refs/tags/v') && '{"include":[{"target":"aarch64-apple-ios","sdk":"iphoneos","plat":"ios-aarch64"},{"target":"aarch64-apple-ios-sim","sdk":"iphonesimulator","plat":"ios-aarch64-sim"}]}' || '{"include":[{"target":"aarch64-apple-ios-sim","sdk":"iphonesimulator","plat":"ios-aarch64-sim"}]}' ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: ${{ matrix.plat }}
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-bin: false
          key: ios-${{ matrix.target }}
      - name: Repair toolchain if rustup-init shadow (cache-poison heal)
        # v0.7.0 (CIRISEdge#17) — verbatim CIRISVerify v2.1.4+ heal.
        # See darwin-aarch64-test for the full rationale; macOS runners
        # exhibit this poison-shim mode under cache restore.
        shell: bash
        run: |
          if cargo build --help 2>&1 | grep -q "rustup-init"; then
            echo "::warning::Detected rustup-init shadow in ~/.cargo/bin; reinstalling toolchain"
            rm -rf "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          cargo --version
          cargo build --help >/dev/null
      - name: Build for iOS
        # Bake the framework install name at build time so
        # install_name_tool isn't needed post-build. install_name_tool
        # rewrites Mach-O headers in place — that shifts code section
        # offsets and breaks downstream binary-hash integrity
        # verification (CIRISVerify v2.0.5+ invariant). RUSTFLAGS-link
        # path leaves the binary hash stable from compile through
        # ship.
        #
        # Features: transport-reticulum only — the canonical
        # cohabitation wire (MISSION §1.4). No PyO3 here (see job
        # docblock above for the rationale); no transport-http
        # (cloud fallback, not mobile).
        #
        # v0.7.1 — `--lib` so the bin target (`emit_edge_extras`,
        # used only by the build-manifest emitter on the host) isn't
        # also linked under this RUSTFLAGS. The `-install_name` flag
        # is `-dynamiclib`-only; applying it to the bin target's
        # `cc` invocation fails with `invalid argument`.
        #
        # Cross-process retry via nick-fields/retry@v3 — see Android
        # lanes for rationale.
        uses: nick-fields/retry@v3
        env:
          RUSTFLAGS: "-C link-arg=-install_name -C link-arg=@rpath/CIRISEdge.framework/CIRISEdge"
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: >-
            cargo build --release --target ${{ matrix.target }} --lib
            --features "transport-reticulum"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-ios-${{ matrix.target }}
          # Edge's [lib].crate-type is `["cdylib", "rlib"]`; the iOS
          # build emits a .dylib (cdylib path). Static .a would
          # require an explicit `staticlib` crate-type — not added
          # here because the XCFramework downstream job consumes
          # the dynamic library successfully (see xcframework job).
          path: |
            target/${{ matrix.target }}/release/libciris_edge.dylib
            target/${{ matrix.target }}/release/libciris_edge.a
          if-no-files-found: error
      # CIRISEdge#229 — save edge-self-warm per iOS PLAT on main + tags (moved
      # here from the removed `ios-pyo3` lane).
      - id: cache-save-ios
        uses: CIRISAI/CIRISCache/save@v1.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true  # a cache SAVE must never fail a build or a release (v34.3.0: setup-oras HTTP 500 skipped the upload)
        with:
          key: ${{ steps.cachekey.outputs.key }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # CIRISPersist#1022 — a tag run's blob is what downstream exact-pins
          # restore, so a non-publish there is an ::error:: (still under the
          # continue-on-error above: loud, never release-gating).
          strict: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      - name: report unpublished cache save (main)
        if: github.ref == 'refs/heads/main' && steps.cache-save-ios.outputs.published != 'true'
        env:
          REASON: ${{ steps.cache-save-ios.outputs.reason || 'save step did not reach the push (e.g. setup-oras failed)' }}
        shell: bash
        run: |
          echo "::warning::CIRISCache save not published: ${REASON}"

  # ─── xcframework: CIRISEdge.xcframework (CIRISEdge#17) ──────────────
  #
  # Pattern lifted verbatim from CIRISVerify v3.1.0 `xcframework`.
  # Bundles the device + simulator artifacts into one
  # `CIRISEdge.xcframework` that Swift consumers drag into Xcode.
  xcframework:
    name: Create XCFramework
    if: startsWith(github.ref, 'refs/tags/v')  # CIRISEdge: release-only, off PR+merge (cut runners)
    needs: build-ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-edge-ios-*
          path: ios-libs
          merge-multiple: false
      - name: Create XCFramework
        run: |
          mkdir -p xcframework-build/ios xcframework-build/ios-sim

          # The dylib name matches the [lib].crate-type cdylib output;
          # edge ships no separate FFI header (consumers use
          # swift-bridge / UniFFI bindings generated from the Rust
          # source, the same path persist's iOS consumers take).
          DEVICE_LIB="ios-libs/ciris-edge-ios-aarch64-apple-ios/libciris_edge.dylib"
          SIM_LIB="ios-libs/ciris-edge-ios-aarch64-apple-ios-sim/libciris_edge.dylib"

          cp "${DEVICE_LIB}" xcframework-build/ios/
          cp "${SIM_LIB}"    xcframework-build/ios-sim/

          # Module map for Swift consumers. No header file because
          # edge's surface comes from swift-bridge bindings, not a
          # hand-rolled C header.
          cat > xcframework-build/module.modulemap << 'EOF'
          module CIRISEdge {
              export *
          }
          EOF
          cp xcframework-build/module.modulemap xcframework-build/ios/
          cp xcframework-build/module.modulemap xcframework-build/ios-sim/

          xcodebuild -create-xcframework \
            -library xcframework-build/ios/libciris_edge.dylib \
            -library xcframework-build/ios-sim/libciris_edge.dylib \
            -output CIRISEdge.xcframework
      - name: package XCFramework as release asset
        # v0.7.0 (CIRISEdge#17) — pack the .xcframework directory into
        # a single tar.gz for `gh release upload`. Verify's release.yml
        # uses the same pattern (`ciris-verify-${TAG}-ios.tar.gz`
        # bundles the XCFramework alongside the raw libs). Without
        # this, `gh release upload` can't take a directory.
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | cut -d'"' -f2)
          tar -czf "ciris-edge-v${VERSION}-xcframework.tar.gz" CIRISEdge.xcframework
          echo "✓ ciris-edge-v${VERSION}-xcframework.tar.gz ($(stat -f%z "ciris-edge-v${VERSION}-xcframework.tar.gz" 2>/dev/null || stat -c%s "ciris-edge-v${VERSION}-xcframework.tar.gz") bytes)"
      - name: Upload XCFramework (raw, for cross-job)
        uses: actions/upload-artifact@v4
        with:
          name: CIRISEdge.xcframework
          path: CIRISEdge.xcframework
          if-no-files-found: error
      - name: Upload XCFramework tarball (for release)
        uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-xcframework-tarball
          path: ciris-edge-v*-xcframework.tar.gz
          if-no-files-found: error

  # ─── lint: clippy + fmt (mission rejection gate) ────────────────────
  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v7.3.0 (verify v8.0.0): tss-esapi removed from ciris-keyring;
      # only libsqlite3-dev remains as a system build dep.
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      # CIRISEdge#229 — restore only; the canonical linux-x86_64 save
      # happens on the `desktop-release-build` linux-x86_64 cell.
      - uses: ./.github/actions/ciriscache
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # v7.4.2 — clippy hits crates.io for the full graph; wrap both
      # invocations with the same retry pattern as the test lanes.
      - name: cargo clippy (default-feature set)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo clippy --all-targets --features "transport-http transport-reticulum pyo3 lxmf mesh-harness test-anchor" -- -D warnings
      - name: cargo clippy (uniffi feature on)
        # v0.13.0 (CIRISEdge#36 GO) — uniffi gate. `pyo3` ⇒ `ffi-uniffi`,
        # but we still keep the explicit check so a `pyo3`-less consumer
        # (mobile-only build) catches drift. The pyo3-less `ffi-uniffi`
        # build itself compiles (under -D warnings) on the
        # `linux-x86_64 (full)` test lane.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo clippy --all-targets --features "transport-http transport-reticulum pyo3 ffi-uniffi" -- -D warnings
      # 45.x LTS — the `pyo3-sqlite` cfg subset (persist's postgres-free
      # PyEngine; no Postgres backend arms) is what CIRISServer's Windows and
      # mobile wheels compile edge with. Its only PR-time compile was the
      # Android PyO3 canary, removed when edge stopped shipping Python, so it
      # is checked here, host-side, until the binding leaves the tree (v62).
      - name: cargo check (pyo3-sqlite subset)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo check --lib --features "transport-reticulum pyo3-sqlite"
      # CIRISEdge#345 (ask #3) — the test-anchor lane. The compile-fenced
      # `test-anchor` feature is what the mesh-repro harness (CIRISServer#258)
      # enables to boot an edge/agent node under CIRIS_TESTING_MODE. Clippy it
      # (so the harness build stays warning-clean) and run the edge-tier e2e
      # that proves a SW-test-root-scrubbed peer ROOTS through edge's
      # root_binding. This test is feature-gated, so it runs ONLY here — the
      # default combos never compile it. NOT in any release lane: the release
      # feature sets omit `test-anchor`, so the relaxation is compiled out.
      - name: cargo clippy (test-anchor on)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          # `--all-targets` (v18.9.0): without it this step lints only the lib,
          # and `test-anchor` is the ONLY combo that compiles
          # `tests/test_anchor_e2e.rs` — so that file was invisible to clippy
          # from v16.0.0 until a local --all-features --all-targets run caught
          # a `too_many_lines` in it. A feature-gated integration test needs
          # the gate that enables the feature to also reach the test target.
          command: cargo clippy --all-targets --features "transport-http transport-reticulum pyo3 test-anchor" -- -D warnings
      - name: cargo test --features test-anchor (edge-tier test-model e2e)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo test --features "transport-reticulum test-anchor" --test test_anchor_e2e --test accord_carrier_verify

  # ─── uniffi-drift: regenerate bindings, assert no diff ──────────────
  #
  # v0.13.0 (CIRISEdge#36 GO) — the language-side bindings are
  # committed under `bindings/{python,kotlin,swift}/` so consumers
  # don't need `uniffi-bindgen` on their build host. This job
  # regenerates them from the UDL + `uniffi.toml` and fails if
  # `git diff` shows drift. Forces the contract that any UDL change
  # ships with regenerated bindings in the same PR.
  uniffi-drift:
    name: uniffi-bindgen drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: ./.github/actions/ciriscache
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
      - name: build uniffi_bindgen_cli
        run: cargo build --bin uniffi_bindgen_cli --features ffi-uniffi
      - name: regenerate Python bindings
        run: ./target/debug/uniffi_bindgen_cli generate udl/ciris_edge.udl --language python --out-dir bindings/python --config uniffi.toml
      - name: regenerate Kotlin bindings
        run: ./target/debug/uniffi_bindgen_cli generate udl/ciris_edge.udl --language kotlin --out-dir bindings/kotlin --config uniffi.toml
      - name: regenerate Swift bindings
        run: ./target/debug/uniffi_bindgen_cli generate udl/ciris_edge.udl --language swift --out-dir bindings/swift --config uniffi.toml
      - name: assert no drift in committed bindings
        run: |
          # Three binding files MUST match what regen produced. Any drift
          # is a hard fail — the PR author needs to commit the regen output
          # alongside their UDL change.
          if ! git diff --exit-code bindings/python/ciris_edge.py \
                                    bindings/kotlin/ai/ciris/edge/ciris_edge.kt \
                                    bindings/swift/CIRISEdge.swift; then
            echo "::error::UniFFI bindings drift detected. Run:"
            echo "  cargo run --bin uniffi_bindgen_cli --features ffi-uniffi -- generate udl/ciris_edge.udl --language python --out-dir bindings/python --config uniffi.toml"
            echo "  (and the kotlin / swift equivalents) and commit the result."
            exit 1
          fi
          echo "OK: bindings match the UDL."

  # ─── license-audit: cargo deny (license + advisories) ───────────────
  #
  # Runner-native (issue #242, pattern proven in CIRISVerify#158):
  # EmbarkStudios/cargo-deny-action@v2 is a Docker container action
  # whose musl rustup printed `error: override toolchain
  # 'stable-x86_64-unknown-linux-musl' is not installed` on every run,
  # and the container didn't inherit the workflow-level CARGO_NET_*
  # flake hardening. taiki-e/install-action drops a prebuilt
  # cargo-deny binary on the runner instead. The invocation below
  # replicates the container action's exact defaults
  # (`--log-level warn --all-features check` → all four gates in
  # deny.toml: licenses, advisories, bans, sources).
  license-audit:
    name: cargo deny (license + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --log-level warn --all-features check

  # ─── benches: per-PR compile gate for the criterion bench suite ─────
  #
  # `cargo bench --no-run` compiles every bench in `benches/` without
  # running any. Cheap (~30 s on a warm cache) and catches bit-rot
  # the moment a bench file's API drifts from the crate surface —
  # without burning the per-run runner minutes a full
  # `cargo bench --workspace` would (criterion sample budgets are
  # measured in minutes).
  #
  # Per `docs/BENCHMARKS.md`:
  #   "ci.yml's `benches` job (proposed) is the fast per-PR gate: it
  #    compiles every bench (--no-run, including the feature-gated
  #    transports + pyo3 subscription) so they cannot bit-rot, without
  #    running them."
  #
  # The actual measurement pass is `bench.yml` (push-to-main +
  # workflow_dispatch). NOT a pass/fail performance gate — that
  # discipline is the `alloc_stability` test in the normal test job
  # (the leak guarantee), not noisy wall-clock numbers.
  benches:
    name: cargo bench --no-run (all features)
    runs-on: ubuntu-latest
    # CIRISEdge#216 — sccache (see desktop-release-build). This job is the
    # poster child: it deliberately never SAVES a CIRISCache layer (#238
    # moved its save to the release-profile linux desktop job after the
    # 7.5 GB blob incident), but the layer it RESTORES is that release-profile
    # target while this compiles the bench profile of the all-features
    # union — near-zero coverage, so it cold-built ~11 min on EVERY run.
    # sccache gives it a real cache without resurrecting the giant blob.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Set up sccache (compiler cache over GHA)
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: ./.github/actions/ciriscache
        with:
          plat: linux-x86_64
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run (all features)
        # All feature-gates so EVERY bench file compiles in this gate —
        # the feature-gated benches (transport-reticulum, transport-http,
        # pyo3) cannot bit-rot silently. `test-anchor` is included so the
        # real body of `accord_threshold_verify` (CIRISEdge#359 — seated
        # roster injection is compile-fenced behind it) is compile-checked
        # here, not just its inert no-feature `main`.
        #
        # Cross-process retry — same rationale as the iOS/Android
        # cross-compile lanes. PR #76 observed the `heck` index flake
        # hitting this lane too (CARGO_NET_RETRY=10 alone wasn't
        # enough when crates.io has a sustained regional sync hiccup;
        # a fresh process attempt after a delay clears the cached
        # negative resolution).
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: cargo bench --no-run --features "transport-http transport-reticulum pyo3 test-anchor codec-fountain"
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ─── desktop-release-build: release-profile desktop compile + cache ──
  #
  # 45.x LTS — this was `pyo3-wheel` (maturin abi3-py310 wheels for linux
  # x86_64 + aarch64, darwin arm64, windows x64), the last of which shipped
  # with v45.1.9. Edge no longer ships Python. What the job did BESIDES the
  # wheels is still needed, so the job stays without maturin:
  #
  #   * it is the canonical CIRISCache save site for the four desktop PLATs
  #     (linux-x86_64, linux-aarch64, macos-aarch64, windows-x64). Edge's own
  #     lanes restore those layers, and so does CIRISServer's build-wheels /
  #     bench, which compiles edge with `pyo3 extension-module` into its one
  #     wheel. Same features, same release profile, same keys as before.
  #   * it is the only place the pyo3 binding compiles on macOS and Windows,
  #     the platforms CIRISServer ships it on.
  #   * its linux-x86_64 cell builds the `emit_edge_extras` host CLI that
  #     `build-manifest` runs.
  #
  # The edge crate is built as an rlib only (`cargo rustc --crate-type
  # rlib`): that is how CIRISServer links it, and it needs no
  # extension-module link arguments (an extension-module cdylib does not
  # link on macOS without maturin's `-undefined dynamic_lookup`).
  #
  # Each matrix entry runs on a NATIVE runner for that target so we
  # avoid cross-compile drama (sysroot, linkers, vendored crypto
  # quirks).
  # v2.4.0 (CIRISEdge#84) — pre-wheel Cargo<->pyproject pin-skew guard.
  # The v1.7.0 -> v2.0.1 cascade shipped three wheels with
  # `Requires-Dist: ciris-persist<5,>=4.15.0` while the bundled cdylib
  # linked persist v5.x; downstream `pip install` hit ResolutionImpossible.
  # This job parses both files and fails fast if the Cargo-pinned tag
  # does not satisfy the pyproject PEP 440 constraint, before any wheel
  # is built. ~10s job. 45.x LTS: edge builds no wheel, but pyproject.toml
  # stays (CIRISConformance's nightly matrix source-builds edge from its
  # git pin through it), so the check stays too — standalone, gating
  # nothing.
  cargo-pyproject-skew-check:
    name: cargo <-> pyproject pin-skew check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install packaging
        run: python -m pip install --quiet "packaging>=23"
      - name: check skew
        run: python3 .github/scripts/check_cargo_pyproject_skew.py

  desktop-release-build:
    name: desktop release build (${{ matrix.label }})
    # CIRISEdge (cut runners): the desktop release builds (linux-x86_64,
    # linux-aarch64, macos-aarch64, windows-x64 — windows alone ~27m) are
    # cross-repo cache warmers; nothing on a PR consumes them (the pyo3
    # compile is covered on PRs by `lint` + `linux-x86_64 (pyo3-lib)`). Off
    # PR; still on main (cache + desktop-break catch) and tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # CIRISEdge#229 — save the cross-repo cache on main-branch + tag
    # builds (one per canonical PLAT: linux-x86_64, linux-aarch64,
    # macos-aarch64, windows-x64). PR runs read but don't write.
    permissions:
      contents: read
      packages: write
    # v2.1.1 — windows-x86_64 wheel is now REQUIRED (closes
    # CIRISEdge#90). All three layers landed:
    #   1. leviculum 4c15dfd — reticulum-std Windows port (leviculum#10/#11)
    #   2. vcpkg static x64-windows-static — openssl-sys link
    #      (RETIRED in v8.1.x / CIRISPersist#328 — Windows builds
    #      `pyo3-sqlite`, so there is no openssl-sys to link anymore)
    #   3. CIRISPersist v5.5.1 — Unix-only code paths cfg-gated (#200)
    # A regression in any of the three fails the gauntlet.
    #
    # v7.4.3 (CIRISEdge#236) — Windows wheel built with STABLE
    # rustc (matches persist + verify + every downstream consumer).
    # Prior cuts used pinned nightly + `-Zbuild-std` against the
    # Tier-3 `x86_64-win7-windows-msvc` target for Win7 SP1 + Server
    # 2008 R2 compat (v2.2.1 mirror of CIRISPersist#205). That made
    # edge's CIRISCache key rustc1.98.0-nightly while persist + verify
    # publish their windows-x64 substrate under stable rustc — so
    # stable consumers (CIRISServer windows wheel) hit verify + persist
    # but COLD-MISSED edge on every Windows build. Win7 has been EOL
    # since 2020; persist + verify already dropped it. Edge matches.
    strategy:
      fail-fast: false
      matrix:
        include:
          # v8.1.x (CIRISPersist#328) — `features` per entry. Linux/macOS
          # keep the full `pyo3` (→ persist `pyo3` → postgres → system
          # OpenSSL, present on those images). Windows uses `pyo3-sqlite`
          # (persist `pyo3-sqlite`, no postgres, no openssl) so the vcpkg
          # static-OpenSSL install step is gone — the flakiest leg of the
          # wheel matrix. All entries keep `extension-module transport-http`.
          - { os: ubuntu-latest,    label: linux-x86_64,   tag: manylinux_2_34_x86_64, features: "pyo3 extension-module transport-http" }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,  tag: manylinux_2_34_aarch64, features: "pyo3 extension-module transport-http" }
          - { os: macos-15,         label: darwin-aarch64, tag: macosx_11_0_arm64, features: "pyo3 extension-module transport-http" }
          # v2.1.1 (CIRISEdge#87 / #90 / leviculum#10) — windows-x86_64
          # wheel. Leviculum's 4c15dfd Windows port of reticulum-std
          # unblocked the FIRST layer (LocalInterface + AutoInterface
          # compile on Windows); the SECOND layer (openssl-sys link via
          # vcpkg static x64-windows-static) lands in this same cut per
          # the OpenSSL install step below. Closes CIRISEdge#90 by
          # validating the full Windows wheel build end-to-end in the
          # gauntlet.
          #
          # v7.4.3 (CIRISEdge#236) — stable rustc, standard
          # `x86_64-pc-windows-msvc` target. Drops Win7 SP1 + Server
          # 2008 R2 compat (EOL 2020); gains cross-repo CIRISCache hits
          # on Windows (the most-expensive leg) — edge's saved blob
          # now matches persist + verify's stable-rustc keys, so
          # downstream stable consumers restore edge's substrate layer
          # instead of cold-recompiling.
          - { os: windows-latest,   label: windows-x86_64, tag: win_amd64, features: "pyo3-sqlite extension-module transport-http" }
    runs-on: ${{ matrix.os }}
    # CIRISEdge#216 — sccache over the GHA cache backend (the CIRISServer
    # bench.yml pattern). The CIRISCache/rust-cache layers are keyed on
    # crate VERSIONS, so every pin bump (and every edge release — the edge
    # version is part of the key) cold-misses them; sccache caches at the
    # compilation-unit level, so unchanged dep sources still hit. Biggest
    # payoff on the windows leg (14m+ maturin build, the CI critical path).
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      # v7.3.0 (verify v8.0.0): tss-esapi removed from ciris-keyring;
      # libsqlite3-dev is the sole remaining system build dep — the
      # wheel-build's auditwheel pass needs the system libsqlite3.so
      # present so it can sidecar-bundle it into
      # `ciris_persist.libs/`. macOS wheels link the host's Apple-
      # provided libsqlite3 (delocate handles it), so this step
      # stays Linux-only.
      - name: install libsqlite3-dev (sqlite build dep)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      # v8.1.x (CIRISPersist#328) — the Windows-only vcpkg static-OpenSSL
      # install step is GONE. The Windows wheel now builds with
      # `pyo3-sqlite` (persist's postgres-free PyEngine variant), so
      # openssl-sys is no longer in the Windows dep tree at all. This
      # closes the "Stage-2 follow-up" flagged here through v8.0.0 and
      # removes the flakiest leg of the wheel matrix (the vcpkg openssl
      # build drove the v7.4.2/v7.4.3/v7.4.4 retry+stable-rustc
      # closures). Linux/macOS keep full `pyo3` (system OpenSSL present).
      # v7.4.3 (CIRISEdge#236) — stable rustc on every wheel matrix
      # entry, including Windows. The prior Windows-only nightly+
      # rust-src branch is gone — the wheel now targets the standard
      # `x86_64-pc-windows-msvc` (Tier-1) so no `-Zbuild-std` is
      # needed.
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Set up sccache (compiler cache over GHA)
        uses: mozilla-actions/sccache-action@v0.0.9
      # CIRISEdge#229 — canonical CIRISCache layered restore on the
      # wheel matrix. PLAT maps wheel's `label` token to the canonical
      # platform token persist + verify save under:
      #   wheel label       → canonical PLAT
      #   linux-x86_64      → linux-x86_64
      #   linux-aarch64     → linux-aarch64
      #   darwin-aarch64    → macos-aarch64   ← rename
      #   windows-x86_64    → windows-x64     ← rename
      - name: map matrix label to canonical PLAT
        id: plat
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            darwin-aarch64) PLAT="macos-aarch64" ;;
            windows-x86_64) PLAT="windows-x64"   ;;
            *)              PLAT="${{ matrix.label }}" ;;
          esac
          echo "plat=${PLAT}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ciriscache
        id: cachekey
        with:
          plat: ${{ steps.plat.outputs.plat }}
      # v0.7.0 (CIRISEdge#17) — cache-bin: false on macOS to defang the
      # rustup-init shadow that the Repair-toolchain heal step below
      # actively corrects. CIRISVerify v2.1.4+ pattern; persist v0.7.2's
      # original work + verify's follow-up active-heal step.
      #
      # v2.2.2 (CIRISPersist#208 mirror) — `key: wheel-${{ matrix.label }}`
      # gives each matrix entry its own cache slot. Without this, all
      # 4 wheel jobs (linux x86_64, linux aarch64, darwin aarch64,
      # windows x86_64) thrash a SINGLE shared cache slot — the last
      # one written wins, every other entry hits an unusable cache
      # (different target triple, different artifacts) and recompiles
      # from scratch. Per-label keying drops the Windows wheel from
      # ~21.9m cold to ~10-12m warm projected. Zero quality impact:
      # cargo fingerprints on Cargo.lock+rustc and always recompiles
      # edge's own (changed) crate; the published wheel is identical
      # to a clean build.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: wheel-${{ matrix.label }}
        continue-on-error: true
      - name: Repair toolchain if rustup-init shadow (cache-poison heal)
        # v0.7.0 (CIRISEdge#17) — CIRISVerify v2.1.4+ pattern verbatim.
        # macOS runners occasionally cache a `~/.cargo/bin/cargo` that IS
        # the rustup-init shim binary. The shim passes `cargo --version`
        # through (any CLI accepts --version), but `cargo build` triggers
        # the shim's argv parser and fails with "unexpected argument
        # 'build' found". Passive `rustup default stable` doesn't help
        # because the rustup binary may share the same shim. Active heal:
        # probe via `cargo build --help` output, nuke ~/.cargo/bin,
        # reinstall toolchain. shell: bash forces Git Bash on Windows
        # runners (default is pwsh, which can't parse if/then/fi).
        shell: bash
        run: |
          if cargo build --help 2>&1 | grep -q "rustup-init"; then
            echo "::warning::Detected rustup-init shadow in ~/.cargo/bin; reinstalling toolchain"
            rm -rf "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # v7.4.3 (CIRISEdge#236) — every wheel matrix entry now uses
          # stable rustc (Windows dropped its nightly + build-std lane).
          rustup default stable
          cargo --version
          cargo build --help >/dev/null
      # pyo3's build script needs a host interpreter to resolve its config,
      # even for an abi3 extension-module build that never links libpython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: cargo build --release (edge as an rlib, the binding on)
        # The feature set CIRISServer compiles edge with (`pyo3
        # extension-module transport-http`; `pyo3-sqlite` on Windows, per
        # CIRISPersist#328), in the release profile, so the CIRISCache blob
        # saved below is the one downstream release builds can reuse.
        # `cargo rustc --crate-type rlib` builds the lib target as an rlib
        # only (see the job header for why not the cdylib).
        #
        # v7.4.2 — cross-process retry via nick-fields/retry@v3 for the
        # crates.io CDN flake class.
        uses: nick-fields/retry@v3
        with:
          # v43.1.0 — persist v59's release build of ciris-persist alone runs past 30
          # minutes on the macos-14 runner (v43.0.0 tag: every darwin-aarch64 attempt
          # timed out compiling that one crate, and sccache saves nothing a timeout
          # cuts off). 75 min x 2 attempts; the job's 6 h cap still bounds it.
          timeout_minutes: 75
          max_attempts: 2
          retry_wait_seconds: 60
          shell: bash
          command: cargo rustc --release --lib --crate-type rlib --features "${{ matrix.features }}"
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats
      # Build the host-side `emit_edge_extras` CLI binary on the
      # linux-x86_64 runner and hand it off to `build-manifest`
      # as an artifact. Avoids `build-manifest` recompiling the full
      # `ciris-edge` release graph a second time just to run a tiny
      # JSON-emitter binary (CI wall-time optimisation; ~3min saved on
      # tag runs). The feature set deliberately differs from the rlib
      # build above: this is a host CLI, NOT a Python extension, so
      # `pyo3` + `extension-module` must NOT be passed (those would
      # require libpython at link time and produce a non-executable
      # binary). `transport-http transport-reticulum` matches the
      # production Phase 1 transport set that the manifest JSON
      # documents under `enabled_transports`.
      - name: cargo build emit_edge_extras (host CLI for build-manifest)
        if: matrix.label == 'linux-x86_64'
        run: cargo build --release --bin emit_edge_extras --features "transport-http transport-reticulum"
      - name: upload emit_edge_extras host binary
        if: matrix.label == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: emit-edge-extras-bin
          path: target/release/emit_edge_extras
          retention-days: 7
      # CIRISEdge#229 — save warm cache to GHCR on main only, one save
      # per canonical PLAT. This matrix is the canonical save
      # site for EVERY desktop PLAT — linux-x86_64, linux-aarch64,
      # macos-aarch64 (`darwin-aarch64` label), windows-x64
      # (`windows-x86_64` label). All four save a release-profile
      # `target/` blob (~1 GB), matching what persist + verify save
      # and what downstream release consumers can actually reuse.
      #
      # v7.4.4 (CIRISEdge#238) — linux-x86_64 was previously saved on
      # the `linux-x86_64-test` (then `pyo3-full`) lane (debug profile + all
      # feature combos + incremental → ~7.5 GB blob). Moved here so
      # consumers get a release blob like every other PLAT.
      - id: cache-save-wheel
        uses: CIRISAI/CIRISCache/save@v1.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true  # a cache SAVE must never fail a build or a release (v34.3.0: setup-oras HTTP 500 skipped the upload)
        with:
          key: ${{ steps.cachekey.outputs.key }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # CIRISPersist#1022 — a tag run's blob is what downstream exact-pins
          # restore, so a non-publish there is an ::error:: (still under the
          # continue-on-error above: loud, never release-gating).
          strict: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      - name: report unpublished cache save (main)
        if: github.ref == 'refs/heads/main' && steps.cache-save-wheel.outputs.published != 'true'
        env:
          REASON: ${{ steps.cache-save-wheel.outputs.reason || 'save step did not reach the push (e.g. setup-oras failed)' }}
        shell: bash
        run: |
          echo "::warning::CIRISCache save not published: ${REASON}"

  # ─── build-manifest: hybrid-signed release provenance ───────────────
  #
  # OQ-12 closure: every released CIRISEdge artifact publishes
  # `EdgeExtras` JSON signed via `ciris-build-sign` (Ed25519 +
  # ML-DSA-65 hybrid) and registers with CIRISRegistry. Round-trip
  # verified as part of the tag-gated release.
  #
  # Trust posture: this manifest is the cryptographic root of trust.
  # The GitHub Release is just a distribution channel — peers verifying
  # authenticity check the registry-side hybrid signature here, not
  # the downloaded artifact itself.
  #
  # 45.x LTS — WHAT is signed changed. Through v45.1.9 the four
  # manifests signed the four desktop abi3 wheels and the registry held
  # the linux/darwin wheel hashes. Edge no longer ships wheels, so the
  # subjects are now the native binaries the Release DOES ship, one
  # manifest per target:
  #   android-arm64-v8a   aarch64-linux-android     libciris_edge.so  (in android.tar.gz)
  #   android-x86_64      x86_64-linux-android      libciris_edge.so  (in android.tar.gz)
  #   android-armeabi-v7a armv7-linux-androideabi   libciris_edge.so  (in android.tar.gz)
  #   ios-aarch64         aarch64-apple-ios         libciris_edge.dylib (in the xcframework)
  #   ios-aarch64-sim     aarch64-apple-ios-sim     libciris_edge.dylib (in the xcframework)
  # Each hash is of the exact per-target artifact the packaging jobs put in
  # the tarballs (android-ndk strips before upload; build-ios bakes its
  # install_name at link time precisely so the dylib hash survives into the
  # xcframework). The android-arm64-v8a manifest is the canonical one: it
  # carries EdgeExtras and is the copy kept as `ciris-edge-<ver>.manifest.json`.
  #
  # Tag-gated: registry registration is a release action. On a
  # branch push + tag push of the same commit, two CI runs would
  # otherwise both POST `version=X` to the registry — and because
  # release builds aren't byte-reproducible, the two runs register
  # different hashes and the loser's round-trip GET fails on a hash
  # mismatch. The tag-gate keeps registration to the tag run only
  # (CIRISEdge#11; v0.2.3 main-run hit the race).
  build-manifest:
    name: Generate + sign build manifest (hybrid Ed25519 + ML-DSA-65)
    runs-on: ubuntu-latest
    # desktop-release-build: the `emit-edge-extras-bin` host CLI.
    # android-ndk + build-ios: the per-target binaries signed below.
    needs: [desktop-release-build, android-ndk, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: install libsqlite3-dev (sqlite build dep)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        # CIRISEdge#502 — bounded, because an apt-mirror stall is silent.
        # Twice this step has wedged a lane with zero output (PR #501 for
        # 2h20m; the v17.4.0 cut for ~3h) while the identical step on other
        # runners finished normally. Without a bound it runs to the job's 6h
        # default, and the cost is not the wall clock: the job never FAILS,
        # so `gh run rerun --failed` does not apply and the whole run must be
        # CANCELLED — taking every healthy check with it. A timeout converts
        # a silent hang into a failed step that reruns alone.
        timeout-minutes: 5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: ./.github/actions/ciriscache
        with:
          plat: linux-x86_64
      - name: extract version from Cargo.toml
        id: version
        run: |
          # Grep pattern tolerates any whitespace between `version`
          # and `=` so column-aligned Cargo.toml formatting works.
          # Empty result fails fast — better than silently propagating
          # an empty version through the registry round-trip.
          VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ -z "${VERSION}" ]; then
            echo "::error::Failed to extract version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ciris-edge version: $VERSION"
      - name: install ciris-build-sign (prebuilt from CIRISVerify v1.9.0)
        # Same pattern persist + lens use. Prebuilt tarball avoids
        # recompiling the upstream signing crate + dep tree (~5min).
        # v1.9.0 matches our Cargo deps so the BuildManifest shape
        # exactly matches what consumers expect.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download v1.9.0 --repo CIRISAI/CIRISVerify \
            --pattern 'ciris-verify-v1.9.0-build-tool-linux-x86_64.tar.gz'
          tar -xzf ciris-verify-v1.9.0-build-tool-linux-x86_64.tar.gz
          sudo install -m755 build-tool/ciris-build-sign /usr/local/bin/ciris-build-sign
          sudo install -m755 build-tool/ciris-build-verify /usr/local/bin/ciris-build-verify
          ciris-build-sign --version
      - name: download pre-built emit_edge_extras
        # The `desktop-release-build` linux-x86_64 cell builds this host CLI as a
        # side-effect of its existing release compile and uploads it as
        # the `emit-edge-extras-bin` artifact. Reusing it here drops
        # ~3min of wall-time off the tag run that would otherwise be
        # spent recompiling `ciris-edge` in release mode from scratch.
        uses: actions/download-artifact@v4
        with:
          name: emit-edge-extras-bin
          path: target/release/
      - name: make emit_edge_extras executable
        # actions/upload-artifact strips the executable bit; restore it
        # before invoking.
        run: chmod +x target/release/emit_edge_extras
      - name: emit EdgeExtras JSON
        # Reads the source tree (Cargo.toml + Cargo.lock + spec docs +
        # the SchemaVersion enum) and emits the typed extras blob.
        # Deterministic per checkout. The pre-built binary above was
        # compiled with `--features "transport-http transport-reticulum"`
        # so `enabled_transports` reflects the production Phase 1 build.
        run: |
          mkdir -p dist
          target/release/emit_edge_extras \
            > "dist/edge-extras-${{ steps.version.outputs.version }}.json"
          echo "EdgeExtras emitted:"
          cat "dist/edge-extras-${{ steps.version.outputs.version }}.json"
      - name: download the per-target Android .so artifacts
        # `ciris-edge-android-<abi>` (one per ABI). The pattern needs the dash
        # after `android`, so it never matches `android-package`'s tarball
        # artifact `ciris-edge-android`.
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-edge-android-*
          path: dist/bin
      - name: download the per-target iOS dylib artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-edge-ios-*
          path: dist/bin
      - name: list the binaries to sign
        run: find dist/bin -type f -name 'libciris_edge.*' -exec ls -la {} \;
      - name: sign manifest with hybrid Ed25519 + ML-DSA-65
        # Two independent secrets per the bridge onboarding (CIRISEdge#1):
        # ciris-build-sign generate-keys produces TWO unrelated 32-byte
        # seeds (one Ed25519, one ML-DSA-65 / FIPS 204), not one with
        # the second derived from the first.
        env:
          CIRIS_BUILD_ED25519_SECRET: ${{ secrets.CIRIS_BUILD_ED25519_SECRET }}
          CIRIS_BUILD_MLDSA_SECRET: ${{ secrets.CIRIS_BUILD_MLDSA_SECRET }}
        run: |
          if [ -z "${CIRIS_BUILD_ED25519_SECRET}" ] || [ -z "${CIRIS_BUILD_MLDSA_SECRET}" ]; then
            echo "::error::Hybrid signing secrets not configured."
            echo "::error::Set CIRIS_BUILD_ED25519_SECRET and CIRIS_BUILD_MLDSA_SECRET."
            echo "::error::Bridge provisioned these per CIRISEdge#1; re-check repo secrets."
            exit 1
          fi
          umask 077
          ED_KEY_PATH=$(mktemp)
          MLDSA_KEY_PATH=$(mktemp)
          printf '%s' "${CIRIS_BUILD_ED25519_SECRET}" | base64 -d > "$ED_KEY_PATH"
          printf '%s' "${CIRIS_BUILD_MLDSA_SECRET}" | base64 -d > "$MLDSA_KEY_PATH"
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/manifests
          # CIRISEdge#471 — EVERY shipped target gets its own hybrid-signed
          # manifest. Each binary sits under dist/bin/<artifact>/ (the
          # downloads above). `--target` is metadata and ciris-build-sign
          # HASHES the file (never runs it), so signing android/iOS binaries on
          # this linux runner is correct.
          sign_platform() {
            local label="$1" target="$2" bin="$3"
            if [ ! -f "$bin" ]; then
              echo "::error::no binary for ${label} at ${bin}"
              exit 1
            fi
            # EdgeExtras is a SOURCE/build-input snapshot (its dep-tree hash is
            # `cargo tree --target x86_64-unknown-linux-gnu`; enabled_transports
            # reflects the emit binary), so only the canonical manifest carries
            # it. The other targets sign binary hash + target + signature WITHOUT
            # it (Codex on #471). `--extras` is optional to ciris-build-sign.
            local extras_args=()
            if [ "$label" = "android-arm64-v8a" ]; then
              extras_args=(--extras "dist/edge-extras-${VERSION}.json")
            fi
            ciris-build-sign sign \
              --primitive edge \
              --build-id "$VERSION" \
              --target "$target" \
              --binary "$bin" \
              --binary-version "$VERSION" \
              "${extras_args[@]}" \
              --ed25519-seed "$ED_KEY_PATH" \
              --mldsa-secret "$MLDSA_KEY_PATH" \
              --key-id ciris-edge-build-v1 \
              --output "dist/manifests/ciris-edge-${VERSION}-${label}.manifest.json"
            echo "✓ signed ${label} (${target})"
          }
          sign_platform android-arm64-v8a   aarch64-linux-android   dist/bin/ciris-edge-android-arm64-v8a/libciris_edge.so
          sign_platform android-x86_64      x86_64-linux-android    dist/bin/ciris-edge-android-x86_64/libciris_edge.so
          sign_platform android-armeabi-v7a armv7-linux-androideabi dist/bin/ciris-edge-android-armeabi-v7a/libciris_edge.so
          sign_platform ios-aarch64         aarch64-apple-ios       dist/bin/ciris-edge-ios-aarch64-apple-ios/libciris_edge.dylib
          sign_platform ios-aarch64-sim     aarch64-apple-ios-sim   dist/bin/ciris-edge-ios-aarch64-apple-ios-sim/libciris_edge.dylib
          shred -uz "$ED_KEY_PATH" "$MLDSA_KEY_PATH" 2>/dev/null || rm -f "$ED_KEY_PATH" "$MLDSA_KEY_PATH"
          # The android-arm64-v8a manifest is the CANONICAL one (it carries
          # EdgeExtras); every target's hash is registered with CIRISRegistry
          # below, and all five manifests ride the GitHub Release.
          cp "dist/manifests/ciris-edge-${VERSION}-android-arm64-v8a.manifest.json" \
             "dist/ciris-edge-${VERSION}.manifest.json"
          echo "=== per-target signed manifests ==="
          ls -la dist/manifests/
          echo "=== canonical (android-arm64-v8a) manifest ==="
          cat "dist/ciris-edge-${VERSION}.manifest.json"
      - name: upload per-target signed manifests
        uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-manifests
          path: dist/manifests/*.manifest.json
          if-no-files-found: error
      - name: pre-flight registry steward-key check
        # Surfaces the registry's active steward key_id to the step
        # summary. Persist + lens log this for human-visible
        # confirmation that the registry isn't running in ephemeral
        # mode (registry AV-28).
        #
        # v0.8.1 — registry response evolved to per-install stewards
        # (US/EU/APAC per CIRISRegistry FSD-002 §2.1 decentralization;
        # same surface CIRISEdge#20 / persist#105 chase). Shape is now
        # `{stewards: [{key_id, classical_pubkey, fingerprint,
        # hardware_class, deployed}, ...]}` — not the old singleton
        # `{classical: {...}}`. Pre-flight filters to `deployed: true`
        # rows; in v0.8.x most installs ship with one deployed steward
        # (US) and two `placeholder_pending_provisioning` rows for the
        # not-yet-provisioned regions. Fail loudly if NO rows are
        # deployed (registry running in ephemeral mode — AV-28).
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
            echo "::warning::REGISTRY_URL repo variable unset; defaulting to ${REGISTRY_URL}"
          fi
          echo "Registry steward-key snapshot for ${REGISTRY_URL}:"
          curl -sf "${REGISTRY_URL}/v1/steward-key" | tee dist/steward-key.json | python3 -m json.tool
          KIDS=$(python3 <<'PY'
          import json, sys
          data = json.load(open("dist/steward-key.json"))

          def fail(msg):
              print(f"::error::{msg} (AV-28 ephemeral-mode guard)", file=sys.stderr)
              raise SystemExit(1)

          # SHAPE 2 (current) — CEG 0.2 accord bundle. `/v1/steward-key` no
          # longer returns `stewards` at all: the root is an accord family with
          # HOLDERS and a quorum of AUTHORIZATIONS over the bundle. There is no
          # `deployed` flag to read, so the old filter silently produced [] and
          # hard-failed a healthy registry (v20.2.0's manifest job).
          #
          # AV-28's intent is unchanged and is what is enforced here: refuse to
          # sign a release manifest against a registry with no real root. Under
          # this shape that means holders present AND the bundle's own declared
          # quorum actually met — checked rather than assumed, because a bundle
          # carrying one signature under `quorum:2/3` is exactly the ephemeral
          # state the guard exists to catch.
          bundle = data.get("bundle")
          if isinstance(bundle, dict):
              holders = [h.get("record", {}) for h in bundle.get("holders") or []]
              holder_ids = [h.get("key_id") for h in holders if h.get("key_id")]
              if not holder_ids:
                  fail("registry accord bundle carries no holders")
              signed_by = {
                  a.get("holder_key_id")
                  for a in bundle.get("authorizations") or []
                  if a.get("holder_key_id")
              }
              proto = str(bundle.get("consensus_protocol") or "")
              need = 0
              if proto.startswith("quorum:"):
                  try:
                      need = int(proto.split(":", 1)[1].split("/", 1)[0])
                  except (ValueError, IndexError):
                      fail(f"unparseable consensus_protocol {proto!r}")
              else:
                  fail(f"unrecognised consensus_protocol {proto!r} — refusing to guess a quorum")
              # CIRISEdge#575 — REPORT, not gate, while the trust root moves.
              #
              # This was a hard failure, matching what the guard is for. It is
              # downgraded to match CIRISPersist#809, whose reasoning applies
              # here unchanged: CIRISRegistry v3.0.0 went live 2026-09-04 and
              # holders and authorizations move during that migration, so a tag
              # run blocked on a mid-migration count is a release blocked on
              # somebody else's deploy window. Edge has already lost one release
              # (v20.2.0, no artifacts at all) to a registry state it does not
              # control, and that is the risk being weighed against.
              #
              # Say plainly what it costs, because a check that cannot fail is a
              # report: for the length of the transition this leg CANNOT catch a
              # registry serving a bundle whose quorum has collapsed. What still
              # fails in that case is the registration step below — this leg is
              # early warning, and this half of it is warning only.
              #
              # Restore it when the root settles; CIRISEdge#575 tracks that, and
              # the two repos should restore together rather than drift again.
              if len(signed_by) < need:
                  print(
                      f"::warning::accord bundle has {len(signed_by)} "
                      f"authorization(s) under {proto} — quorum NOT met. Not "
                      f"gating while the trust root transitions (CIRISEdge#575 / "
                      f"CIRISPersist#809)",
                      file=sys.stderr,
                  )
              root = data.get("charter_root_key_id")
              if not root:
                  fail("registry response names no charter_root_key_id")
              # Informational, never fatal: the SERVING node's own stance on
              # this root. False is normal for an unauthenticated read, so it
              # must not gate a release — but it should be visible.
              served_by = data.get("served_by") or {}
              if not served_by.get("accepts_this_root"):
                  print(
                      "::warning::serving node reports accepts_this_root=false for "
                      f"{root} (informational; does not gate the release)",
                      file=sys.stderr,
                  )
              print(",".join(sorted(holder_ids)))
              raise SystemExit(0)

          # SHAPE 1 (v0.8.x, kept so a registry rollback does not red the lane).
          if "stewards" in data:
              deployed = [s for s in data.get("stewards") or [] if s.get("deployed")]
              if not deployed:
                  fail("No deployed stewards in registry response")
              print(",".join(s["key_id"] for s in deployed))
              raise SystemExit(0)

          # Neither shape. Fail CLOSED and say what arrived — a third shape is a
          # thing to look at, never a thing to wave through.
          fail(f"unrecognised steward-key response; top-level keys={sorted(data)}")
          PY
          )
          echo "registry deployed steward key_ids=${KIDS}" >> "$GITHUB_STEP_SUMMARY"
      - name: register binary manifest with CIRISRegistry
        # POST the binary catalog to /v1/verify/binary-manifest with
        # project=ciris-edge. Bridge provisioned the trusted-primitive
        # entry per CIRISEdge#1 — both regions confirmed.
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
          fi
          if [ -z "${REGISTRY_ADMIN_TOKEN}" ]; then
            echo "::error::REGISTRY_ADMIN_TOKEN secret not configured."
            echo "::error::Bridge provisioned this per CIRISEdge#1; re-check repo secrets."
            exit 1
          fi

          # The same five binaries the manifests above signed. A missing one is
          # an error, not a skip: signing step already refused it, and a
          # registry entry silently short a target is the failure this
          # round-trip exists to catch.
          declare -A TARGET_FOR=(
            ["ciris-edge-android-arm64-v8a/libciris_edge.so"]="aarch64-linux-android"
            ["ciris-edge-android-x86_64/libciris_edge.so"]="x86_64-linux-android"
            ["ciris-edge-android-armeabi-v7a/libciris_edge.so"]="armv7-linux-androideabi"
            ["ciris-edge-ios-aarch64-apple-ios/libciris_edge.dylib"]="aarch64-apple-ios"
            ["ciris-edge-ios-aarch64-apple-ios-sim/libciris_edge.dylib"]="aarch64-apple-ios-sim"
          )

          BINARIES_JSON="{}"
          for REL in "${!TARGET_FOR[@]}"; do
            TARGET="${TARGET_FOR[$REL]}"
            BIN="dist/bin/${REL}"
            if [ ! -f "${BIN}" ]; then
              echo "::error::No binary for ${TARGET} at ${BIN}"
              exit 1
            fi
            SHA="sha256:$(sha256sum "${BIN}" | cut -d' ' -f1)"
            echo "  ${TARGET}: ${SHA} (${REL})"
            BINARIES_JSON=$(python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          d['${TARGET}'] = '${SHA}'
          print(json.dumps(d))
          " "${BINARIES_JSON}")
          done

          # Stash for the round-trip step.
          echo "${BINARIES_JSON}" > dist/binaries-posted.json

          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PAYLOAD=$(python3 -c "
          import json, sys
          binaries = json.loads(sys.argv[1])
          print(json.dumps({
              'project': 'ciris-edge',
              'version': '${{ steps.version.outputs.version }}',
              'binaries': binaries,
              'generated_at': '${GENERATED_AT}',
              'notes': 'CIRIS federation transport substrate; manifest signed via ciris-build-sign --primitive edge (CIRISVerify v1.9.0). Per-target hybrid-signed manifests for the shipped native binaries: android arm64-v8a / x86_64 / armeabi-v7a libciris_edge.so and iOS device / simulator libciris_edge.dylib (all five attached to the GitHub Release). Git-tag-only; ships no Python since 45.x (last wheels: v45.1.9).',
          }))
          " "${BINARIES_JSON}")
          echo "POST ${REGISTRY_URL}/v1/verify/binary-manifest"
          echo "${PAYLOAD}" | python3 -m json.tool
          HTTP_CODE=$(curl -sS -o dist/registry-response.json -w "%{http_code}" \
            -X POST "${REGISTRY_URL}/v1/verify/binary-manifest" \
            -H "Authorization: Bearer ${REGISTRY_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")
          echo "HTTP ${HTTP_CODE}"
          cat dist/registry-response.json | python3 -m json.tool
          if [ "${HTTP_CODE}" != "200" ] && [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Registration POST failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
      - name: round-trip verify GET /v1/verify/binary-manifest/{version}
        # Persist v0.4.0's tag CI hit a transient 404 on the immediate
        # GET after a successful POST registration — registry has a
        # read-after-write window between POST settling and GET seeing
        # the row. Sleep + retry with exponential backoff closes it.
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
          fi
          VERSION="${{ steps.version.outputs.version }}"
          GET_URL="${REGISTRY_URL}/v1/verify/binary-manifest/${VERSION}?project=ciris-edge"
          echo "GET ${GET_URL}"

          # Sleep + retry: initial 5s sleep, then exponential backoff
          # to ~30s total. Closes the read-after-write race persist
          # got bitten by on its v0.4.0 tag run.
          ATTEMPT=1
          MAX_ATTEMPTS=4
          DELAY=5
          while [ ${ATTEMPT} -le ${MAX_ATTEMPTS} ]; do
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS} (sleeping ${DELAY}s first)..."
            sleep ${DELAY}
            HTTP_CODE=$(curl -sS -o dist/round-trip.json -w "%{http_code}" "${GET_URL}")
            echo "HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              break
            fi
            if [ "${HTTP_CODE}" != "404" ]; then
              echo "::error::Round-trip GET returned non-retryable ${HTTP_CODE}"
              cat dist/round-trip.json
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Round-trip GET still 404 after ${MAX_ATTEMPTS} attempts; registry replication never settled"
            exit 1
          fi
          cat dist/round-trip.json | python3 -m json.tool

          # Verify every target hash we POSTed comes back unchanged.
          python3 <<'PY'
          import json, sys
          posted = json.load(open('dist/binaries-posted.json'))
          got_doc = json.load(open('dist/round-trip.json'))
          got = got_doc.get('binaries') or got_doc.get('manifest', {}).get('binaries') or {}
          mismatches = []
          for target, posted_sha in posted.items():
              got_sha = got.get(target, '<missing>')
              if got_sha != posted_sha:
                  mismatches.append(f"  {target}:\n    posted: {posted_sha}\n    got:    {got_sha}")
          if mismatches:
              print("::error::Round-trip hash mismatch on the following targets:")
              for m in mismatches:
                  print(m)
              sys.exit(1)
          print(f"✓ Round-trip verified: {len(posted)} target hashes match GET response:")
          for target, sha in posted.items():
              print(f"  {target}: {sha}")
          PY
          {
            echo "## Registry round-trip"
            echo ""
            echo "- registry: \`${REGISTRY_URL}\`"
            echo "- version: \`${VERSION}\`"
            echo "- attempts to settle: ${ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-edge-build-manifest-${{ steps.version.outputs.version }}
          path: |
            dist/edge-extras-*.json
            dist/ciris-edge-*.manifest.json
            dist/steward-key.json
            dist/registry-response.json
            dist/round-trip.json
            dist/binaries-posted.json

  # ─── cohabitation-conformance: REMOVED (45.x LTS) ───────────────────
  #
  # This tag-only job ran CIRISConformance's reusable
  # `run-against-wheels.yml` (3 platforms × 2 backends) against the
  # just-built `ciris_edge-wheel-<plat>` artifacts, with pin overrides from
  # an `extract-substrate-pins` job. Edge no longer builds wheels (the last
  # release with them is v45.1.9), so there is no under-test artifact to
  # hand it, and both jobs are gone. The Python cohabitation surface is now
  # CIRISServer's one wheel, which bundles edge; cohabitation conformance
  # belongs on that wheel. CIRISConformance's own nightly matrix still
  # source-builds edge from its git pin via pyproject.toml, which is why
  # pyproject.toml and python/ stay in this repo until the v62 line.

  # ─── mobile-release: GitHub Release tarball publish (CIRISEdge#17) ──
  #
  # Pattern lifted verbatim from CIRISPersist v2.0.7+ `mobile-release`
  # (CIRISPersist .github/workflows/ci.yml job `mobile-release`).
  # Tag-gated GitHub Release artifact upload for ALL the mobile +
  # native-Swift lanes that DON'T go through PyPI:
  #
  #   - `ciris-edge-v{VERSION}-android.tar.gz`     — raw per-ABI .so
  #     (native Android consumers, JNI/UniFFI)
  #   - `ciris-edge-v{VERSION}-xcframework.tar.gz` — CIRISEdge.xcframework
  #     (native Swift consumers)
  #   - `ciris-edge-v{VERSION}-kotlin-bindings.tar.gz` /
  #     `ciris-edge-v{VERSION}-swift-bindings.tar.gz` — UniFFI bindings
  #   - the per-target hybrid-signed manifests from `build-manifest`
  #   - `SHA256SUMS`                                — release-attestable
  #     hashes over all of the above
  #
  # There is no PyPI publish; edge is git-tag-only (CIRISEdge#471).
  #
  # 45.x LTS — edge no longer ships Python. The last release carrying the
  # Python assets is v45.1.9: the four desktop abi3 wheels, the
  # `android-wheels.tar.gz` Chaquopy wheels, and `ios.tar.gz` (BeeWare
  # PyO3 `.abi3.so`). Python consumers ride CIRISServer's one wheel.
  #
  # Persist's job: CIRISPersist ci.yml lines 1293-1426. Mirrored shape:
  #   - Tag-gate: `if: startsWith(github.ref, 'refs/tags/v')`
  #   - `gh run download` with 5-attempt retry (absorbs ListArtifacts
  #     transient 403s — persist hit this on v1.5.24 tag run).
  #   - `gh release create --verify-tag` if release doesn't exist yet
  #     (mobile-release is the sole creator now — CIRISEdge#471).
  #   - `gh release upload --clobber` for idempotent tag re-runs.
  #
  # Edge-specific additions: XCFramework asset (verify ships one too;
  # persist doesn't have a native-Swift surface so its `mobile-release`
  # doesn't carry an XCFramework).
  mobile-release:
    name: Upload mobile + native artifacts to GitHub Release (tag-gated)
    runs-on: ubuntu-latest
    needs:
      - android-package
      - xcframework
      - lint
      - license-audit
      # Never publish a release whose platform tests failed, or before the
      # signed manifests exist (no partial-download race). The desktop
      # release builds stay a gate (they were, as `pyo3-wheel`): a release
      # whose pyo3 binding no longer builds on one of CIRISServer's desktop
      # platforms is a broken release for its one wheel.
      - desktop-release-build
      - build-manifest
      - linux-x86_64-test
      - darwin-aarch64-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download Android raw .so artifact (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh run download` (NOT actions/download-artifact@v4) — persist's
        # v1.6.0 hardening absorbs the ListArtifacts 403 transient that
        # the v4 action surfaces directly. 5-attempt retry verbatim.
        run: |
          mkdir -p dist
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-edge-android \
                --dir dist; then
              echo "✓ Android raw .so artifact download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Android artifact download failed 5 times"
              exit 1
            fi
            echo "::warning::Android download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: download XCFramework tarball artifact (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-edge-xcframework-tarball \
                --dir dist; then
              echo "✓ XCFramework tarball download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::XCFramework tarball download failed 5 times"
              exit 1
            fi
            echo "::warning::XCFramework download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: download per-platform signed manifests (with retry)
        # CIRISEdge#471 — the hybrid-signed manifest for EACH shipped native
        # binary (build-manifest signs all five: android x3, iOS device + sim).
        # Attached to the Release so EVERY target's binary is verifiable against
        # a signed manifest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-edge-manifests \
                --dir dist/manifests; then
              echo "✓ signed manifests download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::signed manifests download failed 5 times"
              exit 1
            fi
            echo "::warning::signed manifests download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "=== per-target signed manifests ==="
          ls -la dist/manifests/*.manifest.json
          MCOUNT=$(ls dist/manifests/*.manifest.json 2>/dev/null | wc -l)
          if [ "$MCOUNT" -ne 5 ]; then
            echo "::error::expected 5 per-target signed manifests (android arm64-v8a/x86_64/armeabi-v7a, ios device/sim), got $MCOUNT"
            exit 1
          fi
          # Flatten beside the tarballs — gh release upload/download use a
          # FLAT asset namespace, so SHA256SUMS must reference basenames or
          # `sha256sum -c` fails for a consumer who downloads them side-by-side
          # (CIRISEdge#471, Codex).
          mv dist/manifests/*.manifest.json dist/
      # v0.13.0 (CIRISEdge#36 GO) — bundle the UniFFI-generated Kotlin
      # and Swift bindings as release tarballs. Mobile / native
      # consumers (CIRISAgent KMP UI, future iOS shell) consume them
      # directly without running `uniffi-bindgen`.
      - name: package Kotlin bindings tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "dist/ciris-edge-v${VERSION}-kotlin-bindings.tar.gz" \
              -C bindings kotlin
          echo "✓ packaged Kotlin bindings ($(stat -c%s "dist/ciris-edge-v${VERSION}-kotlin-bindings.tar.gz") bytes)"
      - name: package Swift bindings tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "dist/ciris-edge-v${VERSION}-swift-bindings.tar.gz" \
              -C bindings swift
          echo "✓ packaged Swift bindings ($(stat -c%s "dist/ciris-edge-v${VERSION}-swift-bindings.tar.gz") bytes)"
      - name: verify all four tarballs present
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          VERSION="${{ steps.version.outputs.version }}"
          for ASSET in "ciris-edge-v${VERSION}-android.tar.gz" \
                       "ciris-edge-v${VERSION}-xcframework.tar.gz" \
                       "ciris-edge-v${VERSION}-kotlin-bindings.tar.gz" \
                       "ciris-edge-v${VERSION}-swift-bindings.tar.gz"; do
            if [ ! -f "dist/${ASSET}" ]; then
              echo "::error::Missing expected asset: ${ASSET}"
              exit 1
            fi
            echo "✓ ${ASSET} ($(stat -c%s "dist/${ASSET}" 2>/dev/null || stat -f%z "dist/${ASSET}") bytes)"
          done
      - name: generate SHA256SUMS
        run: |
          cd dist
          # Include the per-target signed manifests so all integrity metadata
          # travels with the Release (CIRISEdge#471). All by BASENAME — release
          # assets are a flat namespace, so `sha256sum -c` works when a consumer
          # downloads them beside SHA256SUMS.
          sha256sum ciris-edge-v*.tar.gz *.manifest.json > SHA256SUMS
          cat SHA256SUMS
      - name: create GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"

          # mobile-release is the SOLE creator of the GitHub Release (edge is
          # git-tag-only; there is no PyPI publish job). Create here if it does
          # not exist yet, otherwise just upload. --verify-tag ensures we don't
          # accidentally create a release for a tag that doesn't exist (e.g.
          # workflow_dispatch on main).
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ciris-edge ${TAG}" \
              --generate-notes \
              --verify-tag
            echo "✓ created release ${TAG}"
          else
            echo "✓ release ${TAG} already exists — uploading assets"
          fi

          # --clobber so tag re-runs are idempotent; GH releases need
          # --clobber explicitly.
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/ciris-edge-v${VERSION}-android.tar.gz" \
            "dist/ciris-edge-v${VERSION}-xcframework.tar.gz" \
            "dist/ciris-edge-v${VERSION}-kotlin-bindings.tar.gz" \
            "dist/ciris-edge-v${VERSION}-swift-bindings.tar.gz" \
            dist/*.manifest.json \
            "dist/SHA256SUMS"

          # Promote draft → published. Idempotent on already-published
          # releases. Closes the v1.2.0 regression where a prior failed
          # tag-CI run had created the release in draft state; the
          # follow-up successful run uploaded assets to the existing
          # release but never flipped it published, so consumers couldn't
          # see iOS / Android assets via the Release page even though
          # the rest of the tag run was green. `gh release edit` is no-op on a non-draft
          # release, so unconditional invocation is the simplest fix.
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          echo "✓ ensured ${TAG} is published (draft → false)"

          echo "✓ uploaded mobile + native assets to ${TAG}"
          {
            echo "## Mobile + native release assets"
            echo ""
            echo "- \`ciris-edge-v${VERSION}-android.tar.gz\` (raw per-ABI .so)"
            echo "- \`ciris-edge-v${VERSION}-xcframework.tar.gz\` (CIRISEdge.xcframework for native Swift consumers)"
            echo "- \`ciris-edge-v${VERSION}-kotlin-bindings.tar.gz\` (UniFFI-generated Kotlin Multiplatform bindings, v0.13.0)"
            echo "- \`ciris-edge-v${VERSION}-swift-bindings.tar.gz\` (UniFFI-generated Swift bindings, v0.13.0)"
            echo "- per-target hybrid-signed \`*.manifest.json\`"
            echo "- \`SHA256SUMS\`"
            echo ""
            echo "No Python assets: the last release with wheels is v45.1.9."
          } >> "$GITHUB_STEP_SUMMARY"

